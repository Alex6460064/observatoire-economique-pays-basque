[project]
name = "observatoire-pays-basque"
version = "0.1.0"
description = "Observatoire économique automatisé du Pays Basque : Sirene, BODACC, BMO -> DuckDB/dbt -> tableau de bord statique."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "socle-territorial",
    "dbt-duckdb>=1.11.0",
    "duckdb>=1.5.5",
    "httpx>=0.28.1",
    "python-calamine>=0.8.2",
    "pyyaml>=6.0.2",
    "tenacity>=9.1.4",
    "typesafe-sdk>=0.7.1",
]

[project.scripts]
obs = "ingestion.cli:main"

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.16.8",
]

[tool.uv.workspace]
members = ["packages/socle_territorial"]

[tool.uv.sources]
socle-territorial = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/socle_territorial/tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # accents et apostrophes typographiques français assumés

[project]
name = "socle-territorial"
version = "0.1.0"
description = "Briques réutilisables pour pipelines de données territoriales : référentiel géographique, enquête BMO, journal d'extraction, secret statistique."
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5",
    "httpx>=0.28",
    "python-calamine>=0.8",
    "tenacity>=9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/socle_territorial"]
